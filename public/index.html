<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Major</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Geist:wght@300..700&display=swap" />
<link rel="stylesheet" href="/app.css" />
<script>
  // Apply the saved theme before first paint.
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="mark" href="/" aria-label="Major, today">M</a>
    <div class="rail-links">
      <a href="/" data-route="today" title="Today (1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 6.5 4 13v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5l-1.5-6.5A2 2 0 0 0 16.6 5H7.4a2 2 0 0 0-1.9 1.5z"/></svg>
        <span>Today</span>
      </a>
      <a href="/overview" data-route="overview" title="Overview (2)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg>
        <span>Overview</span>
      </a>
      <a href="/archive" data-route="archive" title="Archive (3)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        <span>Archive</span>
      </a>
    </div>
    <div class="rail-foot">
      <button type="button" class="sync" id="sync" aria-live="polite"><i></i><span class="sr">Sync status</span></button>
      <button type="button" class="theme" id="theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="keys" class="keys">
  <h2>Keyboard</h2>
  <dl>
    <dt>J / K</dt><dd>Next / previous item</dd>
    <dt>D</dt><dd>Done</dd>
    <dt>L</dt><dd>Later, then 1–6 to pick when</dd>
    <dt>X</dt><dd>Dismiss</dd>
    <dt>R</dt><dd>Reply to Major</dd>
    <dt>U</dt><dd>Undo last action</dd>
    <dt>1 / 2 / 3</dt><dd>Today, Overview, Archive</dd>
    <dt>/</dt><dd>Search the archive</dd>
  </dl>
  <form method="dialog"><button>Close</button></form>
</dialog>
<script src="/glyphs.js"></script>
<script src="/charts.js"></script>
<script src="/app.js"></script>
</body>
</html>
