<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#000000" />
<title>Major</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
<link rel="stylesheet" href="/app.css" />
<script>
  // Dark unless the light theme was picked before.
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <nav class="side" aria-label="Main">
    <p class="side-title">Major</p>
    <div class="side-links">
      <a href="/" data-route="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 6.5 4 13v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5l-1.5-6.5A2 2 0 0 0 16.6 5H7.4a2 2 0 0 0-1.9 1.5z"/></svg>
        <span>Today</span>
        <b class="side-count" id="todayCount"></b>
      </a>
      <a href="/overview" data-route="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg>
        <span>Overview</span>
      </a>
      <a href="/archive" data-route="archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>
        <span>Archive</span>
      </a>
    </div>
    <div class="side-foot">
      <button type="button" class="sync" id="sync" aria-live="polite"><i></i><span class="sync-label">Checking…</span></button>
      <button type="button" class="icon-btn" id="theme" aria-label="Switch to light appearance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="keys" class="sheet">
  <h2>Keyboard shortcuts</h2>
  <dl>
    <dt>J / K</dt><dd>Next / previous item</dd>
    <dt>D</dt><dd>Done</dd>
    <dt>L</dt><dd>Later, then 1–6 to pick when</dd>
    <dt>X</dt><dd>Dismiss</dd>
    <dt>R</dt><dd>Reply to Major</dd>
    <dt>U</dt><dd>Undo</dd>
    <dt>1 / 2 / 3</dt><dd>Today, Overview, Archive</dd>
    <dt>/</dt><dd>Search the archive</dd>
  </dl>
  <form method="dialog"><button class="btn">Done</button></form>
</dialog>
<script src="/glyphs.js"></script>
<script src="/charts.js"></script>
<script src="/app.js"></script>
</body>
</html>
